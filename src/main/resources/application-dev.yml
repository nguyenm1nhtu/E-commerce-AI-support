spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ai_commerce_support}
    username: ${POSTGRES_USER:support}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

app:
  auth:
    refresh-token-cookie:
      secure: ${AUTH_REFRESH_COOKIE_SECURE:false}

server:
  address: localhost

logging:
  level:
    com.ecommerce.aicommercesupport: DEBUG
