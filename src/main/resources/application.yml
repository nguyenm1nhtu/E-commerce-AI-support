spring:
  application:
    name: ai-commerce-support
  cache:
    type: redis
  data:
    redis:
      repositories:
        enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

app:
  redis:
    namespace: ${REDIS_NAMESPACE:ai-commerce-support}
    cache-ttl: ${REDIS_CACHE_TTL:10m}
  auth:
    refresh-token-cookie:
      name: refresh_token
      secure: true
      same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
      max-age: ${AUTH_REFRESH_COOKIE_MAX_AGE:7d}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  paths-to-match: /api/**
  override-with-generic-response: false
  swagger-ui:
    disable-swagger-default-url: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
